<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Stella Cafe &amp; Lounge — Kırklareli</title>
    <meta name="description" content="Kırklareli Merkez'de eşsiz cafe ve lounge deneyimi. Premium kahve, imza içecekler, gurme lezzetler ve lüks atmosfer." />
    <meta property="og:title" content="Stella Cafe &amp; Lounge — Kırklareli" />
    <meta property="og:description" content="Kırklareli'nin en seçkin cafe ve lounge deneyimi." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://stella-lounge-sooty.vercel.app/stella-logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Preconnect to Google Fonts (critical — before any render) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Favicon -->
    <link rel="icon" href="/stella-logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="/stella-logo.png" />
  <!-- Anti-FOUC: apply theme class before React renders -->
  <script>
    (function(){
      var t=localStorage.getItem('stella-theme');
      if(!t)t=window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark';
      document.documentElement.classList.add(t);
    })();
  </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client-entry.tsx"></script>
  </body>
</html>
