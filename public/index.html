<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stella Lounge — Image Picker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0a0a;
      --surface:   #111111;
      --border:    #1f1f1f;
      --muted:     #3f3f3f;
      --text:      #e5e5e5;
      --subtext:   #71717a;
      --accent:    #2563eb;
      --accent-hi: #3b82f6;
      --success:   #16a34a;
      --danger:    #dc2626;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }

    /* ── Header ──────────────────────────────────────────────────── */
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      padding: 14px 24px;
    }

    .brand {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--subtext);
      font-weight: 600;
    }

    .item-info { text-align: center; }
    #itemName  { font-size: 20px; font-weight: 700; color: #fff; line-height: 1.2; }
    #itemMeta  { font-size: 12px; color: var(--subtext); margin-top: 3px; }

    .header-controls {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      align-items: center;
    }

    /* ── Buttons ─────────────────────────────────────────────────── */
    button {
      padding: 7px 14px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--subtext);
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
      white-space: nowrap;
    }
    button:hover:not(:disabled) { background: #1a1a1a; border-color: var(--muted); color: var(--text); }
    button:disabled { opacity: 0.35; cursor: not-allowed; }

    button.btn-primary { background: var(--accent); border-color: var(--accent-hi); color: #fff; font-weight: 600; }
    button.btn-primary:hover:not(:disabled) { background: var(--accent-hi); }

    button.btn-mode { font-size: 11px; letter-spacing: 0.05em; padding: 5px 10px; }
    button.btn-mode.active { background: #1e293b; border-color: var(--accent); color: var(--accent-hi); }

    /* ── Main ────────────────────────────────────────────────────── */
    main { max-width: 1400px; margin: 0 auto; padding: 20px 24px 60px; }

    /* ── Progress bar ────────────────────────────────────────────── */
    .progress-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }
    #progressText { font-size: 12px; color: var(--subtext); min-width: 60px; }
    .progress-track {
      flex: 1;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.35s ease;
    }
    #itemCountBadge {
      font-size: 11px;
      color: var(--subtext);
      background: var(--border);
      padding: 2px 8px;
      border-radius: 100px;
    }

    /* ── Error banner ────────────────────────────────────────────── */
    #errorBanner {
      display: none;
      background: #1a0a0a;
      border: 1px solid #7f1d1d;
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 13px;
      line-height: 1.5;
    }
    #errorBanner button {
      margin-left: 10px;
      padding: 3px 10px;
      font-size: 12px;
      border-color: #7f1d1d;
      color: #fca5a5;
      background: transparent;
    }

    /* ── Search query label ───────────────────────────────────────── */
    #searchLabel {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 14px;
      font-style: italic;
    }

    /* ── Image grid ──────────────────────────────────────────────── */
    #imageGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 10px;
    }

    .img-card {
      aspect-ratio: 1;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      background: var(--surface);
      position: relative;
      transition: border-color 0.12s, transform 0.12s, box-shadow 0.12s;
    }
    .img-card:hover {
      border-color: var(--accent);
      transform: scale(1.025);
      box-shadow: 0 0 0 4px rgba(37,99,235,0.15);
    }
    .img-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.2s;
    }
    .img-card img.loading { opacity: 0; }
    .img-card .load-error {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 11px;
      flex-direction: column;
      gap: 6px;
    }
    .img-card .load-error span { font-size: 24px; }

    /* ── Skeleton loader ─────────────────────────────────────────── */
    .skeleton {
      aspect-ratio: 1;
      border-radius: 10px;
      background: linear-gradient(90deg, var(--surface) 25%, #181818 50%, var(--surface) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }

    /* ── Processing overlay ──────────────────────────────────────── */
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      transition: opacity 0.2s;
    }
    #overlay.hidden { display: none; }

    .overlay-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      text-align: center;
      max-width: 340px;
      width: 90%;
    }
    #overlayThumb {
      width: 110px;
      height: 110px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .overlay-title    { font-size: 17px; font-weight: 700; color: #fff; margin-bottom: 8px; }
    .overlay-subtitle { font-size: 12px; color: var(--subtext); line-height: 1.6; }
    .overlay-step     { font-size: 11px; color: var(--accent-hi); margin-top: 12px; font-weight: 600; }

    /* ── Toast ───────────────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--success);
      color: #fff;
      padding: 11px 18px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.25s, transform 0.25s;
      z-index: 200;
      pointer-events: none;
    }
    #toast.show { opacity: 1; transform: translateY(0); }

    /* ── Done / Empty states ─────────────────────────────────────── */
    .full-state {
      text-align: center;
      padding: 100px 0;
    }
    .full-state .icon  { font-size: 52px; margin-bottom: 18px; }
    .full-state h2     { font-size: 24px; font-weight: 700; color: #fff; margin-bottom: 10px; }
    .full-state p      { color: var(--subtext); line-height: 1.6; }
  </style>
</head>
<body>

<!-- ── Header ──────────────────────────────────────────────────────────────── -->
<header>
  <span class="brand">Stella Lounge</span>

  <div class="item-info">
    <div id="itemName">Loading…</div>
    <div id="itemMeta"></div>
  </div>

  <div class="header-controls">
    <button class="btn-mode active" id="modeBtn" onclick="toggleMode()" title="Switch between pending-only / all items">Pending only</button>
    <button id="refreshBtn" onclick="refreshSearch()" disabled>↻ Refresh</button>
    <button id="skipBtn"    onclick="skipItem()"      disabled>Skip →</button>
  </div>
</header>

<!-- ── Main ────────────────────────────────────────────────────────────────── -->
<main>
  <div class="progress-row">
    <span id="progressText">—</span>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <span id="itemCountBadge">0 items</span>
  </div>

  <div id="errorBanner"></div>
  <div id="searchLabel"></div>
  <div id="imageGrid"></div>
</main>

<!-- ── Processing Overlay ───────────────────────────────────────────────────── -->
<div id="overlay" class="hidden">
  <div class="overlay-box">
    <img id="overlayThumb" src="" alt="Selected image" />
    <div class="spinner"></div>
    <div class="overlay-title">Processing…</div>
    <div class="overlay-subtitle">
      Removing background &amp; compositing<br>
      onto a black 1024×1024 canvas,<br>
      then uploading to Supabase.
    </div>
    <div class="overlay-step" id="overlayStep">Downloading image…</div>
  </div>
</div>

<!-- ── Toast ────────────────────────────────────────────────────────────────── -->
<div id="toast"></div>

<script>
  /* ── State ──────────────────────────────────────────────────────────────── */
  let items         = [];
  let currentIndex  = 0;
  let searchResults = [];
  let mode          = 'pending'; // 'pending' | 'all'

  const STEPS = [
    'Downloading image…',
    'Removing background… (first run: ~100 MB model download)',
    'Compositing on black canvas…',
    'Uploading to Supabase…',
    'Updating database…',
  ];

  /* ── Init ───────────────────────────────────────────────────────────────── */
  async function init() {
    setUI({ name: 'Loading…', meta: '', refreshDisabled: true, skipDisabled: true });
    clearError();

    try {
      const endpoint = mode === 'pending' ? '/api/pending-items' : '/api/all-items';
      const res = await fetch(endpoint);
      if (!res.ok) throw new Error(`Server returned ${res.status}`);
      items = await res.json();

      if (!Array.isArray(items) || items.length === 0) {
        setUI({ name: 'All done!', meta: 'No pending items found.' });
        renderDone();
        return;
      }

      currentIndex = 0;
      loadItem();
    } catch (err) {
      showError('Could not connect to the server: ' + err.message);
    }
  }

  /* ── Load current item ──────────────────────────────────────────────────── */
  function loadItem() {
    if (currentIndex >= items.length) { renderDone(); return; }

    const item  = items[currentIndex];
    const total = items.length;

    setUI({
      name: item.name_tr || '—',
      meta: item.category || '',
      refreshDisabled: false,
      skipDisabled:    false,
    });
    updateProgress(currentIndex + 1, total);
    clearError();
    fetchImages(item);
  }

  /* ── Fetch & display images ─────────────────────────────────────────────── */
  async function fetchImages(item) {
    const grid = document.getElementById('imageGrid');
    grid.innerHTML = Array(12).fill('<div class="skeleton"></div>').join('');

    const q = item.name_tr || '';
    document.getElementById('searchLabel').textContent = `Searching: "${q} yemek fotoğrafı food photography"`;

    try {
      const res = await fetch('/api/search?q=' + encodeURIComponent(q));
      const data = await res.json();

      if (!res.ok || data.error) {
        showError(data.error || 'Image search failed.', true);
        grid.innerHTML = '';
        return;
      }

      searchResults = data;
      renderGrid(data);
    } catch (err) {
      showError('Search error: ' + err.message, true);
      grid.innerHTML = '';
    }
  }

  function renderGrid(results) {
    const grid = document.getElementById('imageGrid');

    if (!results.length) {
      grid.innerHTML = `<div class="full-state" style="grid-column:1/-1">
        <div class="icon">🔍</div><h2>No images found</h2>
        <p>Try refreshing or skip this item.</p></div>`;
      return;
    }

    grid.innerHTML = results.map((r, i) => `
      <div class="img-card" onclick="selectImage(${i})" title="${esc(r.title || '')}">
        <img src="${esc(r.thumbnail || r.url)}" alt="${esc(r.title || '')}"
          class="loading"
          onload="this.classList.remove('loading')"
          onerror="this.parentElement.innerHTML='<div class=\\'load-error\\'><span>🚫</span>Failed to load</div>'"
          loading="lazy" />
      </div>`).join('');
  }

  /* ── Select & process ───────────────────────────────────────────────────── */
  async function selectImage(index) {
    const item   = items[currentIndex];
    const result = searchResults[index];
    if (!item || !result) return;

    // Show overlay
    document.getElementById('overlayThumb').src = result.thumbnail || result.url;
    document.getElementById('overlay').classList.remove('hidden');
    animateSteps();

    try {
      const res = await fetch('/api/process', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ id: item.id, imageUrl: result.url, name: item.name_tr }),
      });
      const data = await res.json();

      document.getElementById('overlay').classList.add('hidden');

      if (!res.ok || !data.success) {
        showError((data.error || 'Processing failed.') + ' — Choose a different image.', true);
        return;
      }

      showToast(`✓ ${item.name_tr || 'Item'} saved!`);
      currentIndex++;
      setTimeout(loadItem, 500);

    } catch (err) {
      document.getElementById('overlay').classList.add('hidden');
      showError('Network error: ' + err.message, true);
    }
  }

  let stepTimer = null;
  function animateSteps() {
    let s = 0;
    clearInterval(stepTimer);
    document.getElementById('overlayStep').textContent = STEPS[0];
    stepTimer = setInterval(() => {
      s = (s + 1) % STEPS.length;
      document.getElementById('overlayStep').textContent = STEPS[s];
    }, 8000);
  }

  /* ── Controls ───────────────────────────────────────────────────────────── */
  function refreshSearch() {
    const item = items[currentIndex];
    if (item) fetchImages(item);
  }

  function skipItem() {
    currentIndex++;
    loadItem();
  }

  function toggleMode() {
    mode = mode === 'pending' ? 'all' : 'pending';
    document.getElementById('modeBtn').textContent = mode === 'pending' ? 'Pending only' : 'All items';
    document.getElementById('modeBtn').classList.toggle('active', mode === 'pending');
    init();
  }

  /* ── UI helpers ─────────────────────────────────────────────────────────── */
  function setUI({ name, meta, refreshDisabled = true, skipDisabled = true }) {
    document.getElementById('itemName').textContent = name;
    document.getElementById('itemMeta').textContent = meta;
    document.getElementById('refreshBtn').disabled  = refreshDisabled;
    document.getElementById('skipBtn').disabled     = skipDisabled;
  }

  function updateProgress(current, total) {
    document.getElementById('progressText').textContent    = `${current} / ${total}`;
    document.getElementById('progressFill').style.width    = `${(current / total) * 100}%`;
    document.getElementById('itemCountBadge').textContent  = `${total - current} remaining`;
  }

  function renderDone() {
    document.getElementById('imageGrid').innerHTML = `
      <div class="full-state" style="grid-column:1/-1">
        <div class="icon">🎉</div>
        <h2>All Done!</h2>
        <p>Every item has been processed.<br>Switch to "All items" mode to revisit any item.</p>
      </div>`;
    document.getElementById('progressText').textContent   = 'Complete';
    document.getElementById('itemCountBadge').textContent = '0 remaining';
    document.getElementById('progressFill').style.width   = '100%';
    document.getElementById('searchLabel').textContent    = '';
    setUI({ name: 'All Done!', meta: '' });
  }

  function showError(msg, withRetry = false) {
    const el = document.getElementById('errorBanner');
    el.innerHTML = '⚠ ' + msg + (withRetry
      ? ' <button onclick="refreshSearch()">Retry search</button>'
      : '');
    el.style.display = 'block';
  }
  function clearError() {
    const el = document.getElementById('errorBanner');
    el.style.display = 'none';
    el.innerHTML = '';
  }

  let toastTimer = null;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
  }

  function esc(str) {
    return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  /* ── Boot ───────────────────────────────────────────────────────────────── */
  init();
</script>
</body>
</html>
